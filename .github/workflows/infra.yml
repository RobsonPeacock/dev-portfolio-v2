name: Infra Deployment
run-name: Performs checks and deployment with latest changes
on: 
  push:
    paths:
    - 'infra/**'
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_custom_email: ${{ secrets.CUSTOM_EMAIL }}
  TF_VAR_destination_email: ${{ secrets.DESTINATION_EMAIL }}
  SCRIPTS_BUCKET_NAME: ${{ secrets.SCRIPTS_BUCKET_NAME }}
permissions:
  id-token: write
  contents: read
jobs:
  bootstrap:
    name: Deploy Bootstrap Resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0

      - name: Terraform fmt (Bootstrap)
        run: terraform fmt -check
        working-directory: ./infra/bootstrap

      - name: Terraform Init (Bootstrap)
        run: |
          terraform init -input=false
        working-directory: ./infra/bootstrap

      - name: Terraform Validate (Bootstrap)
        run: terraform validate -no-color
        working-directory: ./infra/bootstrap

      - name: Terraform Plan (Bootstrap)
        run: terraform plan -no-color -input=false
        working-directory: ./infra/bootstrap

      - name: Terraform Apply (Bootstrap)
        run: terraform apply -auto-approve -input=false
        working-directory: ./infra/bootstrap
  live:
    name: Deploy Live Resources
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0

      - name: Terraform fmt (Live)
        run: terraform fmt -check
        working-directory: ./infra/live

      - name: Terraform Init (Live)
        run: |
          terraform init -input=false
        working-directory: ./infra/live

      - name: Terraform Validate (Live)
        run: terraform validate -no-color
        working-directory: ./infra/live

      - name: Terraform Plan (Live)
        run: terraform plan -no-color -input=false
        working-directory: ./infra/live

      - name: Terraform Apply (Live)
        run: terraform apply -auto-approve -input=false
        working-directory: ./infra/live

      - name: Sync backup script to S3
        run: |
          aws s3 sync ./scripts s3://${{ secrets.SCRIPTS_BUCKET_NAME }} \
            --exclude "*" \
            --include "db_backup.sh" \
            --include "setup_backup_cron.sh"
        working-directory: ./infra/live

      - name: Setup backup script cron job
        run: |
          instance_id=$(terraform output -raw db_instance_id)

          aws ec2 wait instance-running --instance-ids "$instance_id"

          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=instanceIds,Values=$instance_id" \
            --document-name "AWS-RunShellScript" \
            --comment "Setup backup script cron job" \
            --parameters "commands=[\"
                                    install -d -m 700 -o root -g root /opt/portfolio/scripts &&
                                    sudo aws s3 sync s3://$SCRIPTS_BUCKET_NAME/setup_backup_cron.sh /opt/portfolio/scripts/setup_backup_cron.sh && 
                                    chmod 700 /opt/portfolio/scripts/setup_backup_cron.sh
                                    \"]")

          echo "Sent command $COMMAND_ID to instances tagged Name=dev-portfolio-db-instance"

          echo "Waiting for deployment to complete..."
          sleep 10

          aws ssm wait command-executed \
          --command-id "$COMMAND_ID" \
          --instance-id "$instance_id"

          echo "Deployment completed successfully."
        working-directory: ./infra/live