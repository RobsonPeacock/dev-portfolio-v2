name: Infra Deployment
run-name: Performs checks and deployment with latest changes
on: 
  push:
    paths:
    - 'infra/**'
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_custom_email: ${{ secrets.CUSTOM_EMAIL }}
  TF_VAR_destination_email: ${{ secrets.DESTINATION_EMAIL }}
  SCRIPTS_BUCKET_NAME: ${{ secrets.SCRIPTS_BUCKET_NAME }}
permissions:
  id-token: write
  contents: read
jobs:
  bootstrap:
    name: Deploy Bootstrap Resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0

      - name: Terraform fmt (Bootstrap)
        run: terraform fmt -check
        working-directory: ./infra/bootstrap

      - name: Terraform Init (Bootstrap)
        run: |
          terraform init -input=false
        working-directory: ./infra/bootstrap

      - name: Terraform Validate (Bootstrap)
        run: terraform validate -no-color
        working-directory: ./infra/bootstrap

      - name: Terraform Plan (Bootstrap)
        run: terraform plan -no-color -input=false
        working-directory: ./infra/bootstrap

      - name: Terraform Apply (Bootstrap)
        run: terraform apply -auto-approve -input=false
        working-directory: ./infra/bootstrap
  live:
    name: Deploy Live Resources
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0

      - name: Terraform fmt (Live)
        run: terraform fmt -check
        working-directory: ./infra/live

      - name: Terraform Init (Live)
        run: |
          terraform init -input=false
        working-directory: ./infra/live

      - name: Terraform Validate (Live)
        run: terraform validate -no-color
        working-directory: ./infra/live

      - name: Terraform Plan (Live)
        run: terraform plan -no-color -input=false
        working-directory: ./infra/live

      - name: Terraform Apply (Live)
        run: terraform apply -auto-approve -input=false
        working-directory: ./infra/live

      - name: Sync backup script to S3
        run: |
          aws s3 sync ./scripts s3://${{ secrets.SCRIPTS_BUCKET_NAME }}
        working-directory: ./infra/live

      - name: Setup backup script cron job
        run: |
          instance_state=$(aws ec2 describe-instances \
                          --instance-ids $(terraform output -raw web_instance_id) \
                          --query 'Reservations[*].Instances[*].State.Name' --output text)

          if [ "$instance_state" = "running" ]; then
            aws ssm send-command \
              --targets "Key=instanceIds,Values=$(terraform output -raw web_instance_id)" \
              --document-name "AWS-RunShellScript" \
              --comment "Setup backup script cron job" \
              --parameters '[aws s3 cp s3://'$SCRIPTS_BUCKET_NAME'/backup.sh /home/ec2-user/scripts/backup.sh]' \
              --region us-east-1
          fi
        working-directory: ./infra/live